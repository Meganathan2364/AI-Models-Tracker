name: fetch-data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r requirements.txt
      - name: Run all collector jobs
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python -m backend.jobs all
      - name: Commit changed data
        run: |
          git config user.name "ai-models-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data update $(date -u +%F\ %H:%M)" && git push)
