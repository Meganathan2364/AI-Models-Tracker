  if (minutes < 60) return `in ${minutes}m`;

async function loadDatasets() {

    try {

      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      const source = r.headers.get("X-AI-Data-Source");
      if (source === "local-fallback") dataStorageMode = "local-fallback";
      else if (source === "local-only" && dataStorageMode !== "local-fallback") dataStorageMode = "local-only";
      D[f] = await r.json();

      D[f] = null;

    const startedAt = timestampMs(result.refresh.last_started_at);

        ? "Refresh finished with an error. The last available data is shown."
        : "Refresh finished. The latest available data is now shown.";

/* ---------- best for ---------- */
let purpose = null;
let bestModelType = "";
const BEST_MODEL_TYPES = [
  {id: "text", label: "Text generation"},

  {id: "video", label: "Video generation"},

const matchesBestModelType = m => !bestModelType || (m.outputs || []).some(output => String(output).toLowerCase() === bestModelType);
function bestView() {
  const b = D.best;

  const P = D.meta?.purposes || {}, cur = b[purpose];
  const modelByKey = new Map(models().map(model => [model.key, model]));
  const ranked = (cur.candidates || cur.top || [])
    .map(key => modelByKey.get(key))
    .filter(model => model && model.listed !== false && matchesBestModelType(model));
  const top = ranked.slice(0, 10);
  const providerIds = new Set(Object.keys(cur.by_provider || {}));
  const selectedProviders = new Set();
  const providerPicks = ranked.filter(model => {
    if (!providerIds.has(model.provider) || selectedProviders.has(model.provider)) return false;

/* ---------- compare ---------- */
function compare() {
  const ms = [...picked].map(byKey).filter(Boolean);
  if (ms.length < 2) return show(`<h2>Compare</h2><p class="sub">Tick two to four models in the Models tab, then come back here.</p><div class="panel empty">${ms.length} selected. <a href="#/models">Choose models</a></div>`);
  const columns = `style="--columns:${ms.length}"`;
  const metrics = [
    {label:"Context window", key:"context", lower:false, format:ctx},
    {label:"Maximum output tokens", key:"max_output", lower:false, format:value => value == null ? "–" : fmtN(value)},
    {label:"Input cost / 1M tokens", key:"input_price", lower:true, format:money},
    {label:"Output cost / 1M tokens", key:"output_price", lower:true, format:money},
  ];
  const metricRow = metric => {
    const values = ms.map(m => m[metric.key] == null || m[metric.key] === "" || !Number.isFinite(Number(m[metric.key]))
      ? null
      : Number(m[metric.key]));
    const present = values.filter(value => value !== null);
    const max = Math.max(...present, 0), best = present.length ? (metric.lower ? Math.min(...present) : max) : null;
    return `<div class="compare-grid" ${columns}><div class="compare-row-label">${esc(metric.label)}<div class="compare-note">${metric.lower ? "Lower costs less" : "Higher is more"}</div></div>${ms.map((m, i) => {
      const value = values[i];
      if (value === null) return `<div class="compare-value"><span>Not reported</span></div>`;
      const width = max > 0 ? Math.max(4, value / max * 100) : 4;
      return `<div class="compare-value ${value === best ? "best" : ""}"><div class="compare-track"><i style="width:${width}%"></i></div><span>${esc(metric.format(value))}</span></div>`;
    }).join("")}</div>`;
  };
  const featureRows = [
    ["Capabilities", "Reasoning", m => m.reasoning],
    ["Capabilities", "Tool / function calling", m => m.tool_call],
    ["Capabilities", "Web search", m => m.web_search],
    ["Capabilities", "Structured output", m => m.structured_output],
    ["Capabilities", "JSON mode", m => m.json_mode],
    ["Capabilities", "Open weights", m => m.open_weights],
    ["Input and output", "Input modalities", m => m.modalities],
    ["Input and output", "Output modalities", m => m.outputs],
    ["Limits", "Knowledge cutoff", m => m.knowledge],
    ["Limits", "Tokenizer", m => m.tokenizer],
    ["Limits", "Temperature control", m => m.temperature],
    ["Model details", "Provider", m => prov(m.provider).name],
    ["Model details", "Released", m => m.release_date],
    ["Model details", "Family", m => m.family],
    ["Model details", "API identifier", m => m.id],
    ["Model details", "Reported sources", m => (m.source || []).join(", ")],
  ];
  const displayFeature = value => {
    if (value === true) return ["Yes", "yes"];
    if (value === false) return ["No", "no"];
    if (value == null || value === "") return ["Not reported", "unknown"];
    if (Array.isArray(value)) return [value.length ? value.join(", ") : "Not reported", value.length ? "" : "unknown"];
    return [String(value), ""];
  };
  let lastGroup = "";
  const comparisonRows = featureRows.map(([group, label, get]) => {
    const heading = group !== lastGroup ? `<tr><th class="compare-group" colspan="${ms.length + 1}">${esc(group)}</th></tr>` : "";
    lastGroup = group;
    return `${heading}<tr><th scope="row">${esc(label)}</th>${ms.map(m => {
      const [value, state] = displayFeature(get(m));
      return `<td><span class="feature-value ${state}">${esc(value)}</span></td>`;
    }).join("")}</tr>`;
  }).join("");
  show(`<div class="compare-toolbar"><div><h2>Model comparison</h2><p class="sub">Compare up to four models using reported pricing, limits, and capabilities.</p></div><button id="clr" type="button">Clear selection</button></div>
  <section class="sec"><h2>Capacity and pricing</h2><div class="compare-scroll"><div class="compare-grid compare-model-head" ${columns}><div>Metric</div>${ms.map(m => `<div>${icon(m.provider)}<strong>${mlink(m)}</strong><small>${esc(prov(m.provider).name)}</small></div>`).join("")}</div>${metrics.map(metricRow).join("")}</div></section>
  <section class="sec"><h2>Feature comparison</h2><div class="panel tablewrap"><table><thead><tr><th>Feature</th>${ms.map(m => `<th>${mlink(m)}</th>`).join("")}</tr></thead><tbody>${comparisonRows}</tbody></table></div><p class="compare-note">“Not reported” means the available catalog sources did not provide that detail; it does not mean the model lacks the feature.</p></section>`);
  $("#clr").onclick = () => { picked.clear(); compare(); };
}

  show(`<h2>Deprecations</h2><p class="sub">Models retiring today or later are listed first; expired dates are under “Already retired.” Dates are parsed from provider pages and APIs. Always confirm on the source page. Updated ${ago(D.deprecations.updated)}.</p>
  <ul class="runway panel">${up.map(runwayItem).join("") || '<li class="muted">Nothing scheduled.</li>'}</ul>
  ${dropped.length ? `<details style="margin-top:20px"><summary>No longer on the source page (${dropped.length})</summary><p class="sub" style="margin-top:10px">Kept for history. A date may have been replaced or the entry removed.</p><ul class="runway panel">${dropped.slice(0, 150).map(r => `<li><div class="rows"><a href="${href(r.source_url)}">${esc(r.model)}</a><span class="muted">${esc(r.retire_guess)}</span></div><div class="muted">${esc(prov(r.provider).name || r.provider)} · last seen ${esc(r.last_seen || "–")}</div></li>`).join("")}</ul></details>` : ""}
  <details style="margin-top:20px"><summary>Already retired (${gone.length})</summary><ul class="runway panel" style="margin-top:10px">${gone.slice(0, 150).map(r => `<li><div class="rows"><a href="${href(r.source_url)}">${esc(r.model)}</a><span class="muted">${esc(r.retire_guess)}</span></div><div class="muted">${esc(prov(r.provider).name || r.provider)}</div></li>`).join("")}</ul></details>`);
}

/* ---------- news ---------- */
let src = "";
function newsView() {
  const items = [...(D.news?.items || [])].sort((a, b) => {
    const aDate = Date.parse(a.published || "") || 0, bDate = Date.parse(b.published || "") || 0;
    return bDate - aDate;
  });
  if (!items.length) return show(`<h2>News</h2>${empty("news")}`);
  const srcs = [...new Set(items.map(i => i.source))];
  const filtered = items.filter(item => !src || item.source === src).slice(0, 80);
  const cards = filtered.map(item => {
    const description = item.description ? `<p class="news-description">${esc(plain(item.description))}</p>` : "";
    const published = item.published && Number.isFinite(Date.parse(item.published)) ? `<time>${ago(item.published)}</time>` : "";
    return `<article class="news-card"><div class="news-copy"><div class="news-meta"><span>${esc(item.source)}</span>${published}</div><h3 class="news-title"><a href="${href(item.link)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3>${description}<a class="news-read" href="${href(item.link)}" target="_blank" rel="noopener noreferrer">Read at source &rarr;</a></div></article>`;
  }).join("");
  show(`<h2>Latest news</h2><p class="sub">Newest stories from the configured feeds.</p><div class="controls news-controls"><label for="s">Filter by source</label><select id="s" aria-label="Filter by source"><option value="">All sources</option>${srcs.map(source => `<option value="${esc(source)}" ${source === src ? "selected" : ""}>${esc(source)}</option>`).join("")}</select></div><div class="news-grid">${cards || `<div class="panel empty">No stories match this source.</div>`}</div>`);
  $("#s").onchange = e => { src = e.target.value; newsView(); };
}

boot();
setInterval(renderFreshness, 30000);
setInterval(updateRefreshStatus, 30000);
</script>
</body>
