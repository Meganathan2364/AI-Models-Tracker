<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign in — AI Models Tracker</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#1d2923;background:#f4f6f2}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}
main{width:min(100%,400px);padding:28px;background:#fff;border:1px solid #dce4dc;border-radius:12px}
h1{margin:0 0 6px;font-size:22px}
p{margin:0 0 20px;color:#66736b}
label{display:block;margin:14px 0 5px;font-weight:600}
input,button{width:100%;padding:10px 12px;border:1px solid #cbd6cc;border-radius:7px;font:inherit}
button{margin-top:20px;background:#176b57;color:#fff;border-color:#176b57;cursor:pointer}
#message{min-height:24px;margin-top:12px;color:#a33}
</style>
</head>
<body>
<main>
  <h1>Admin sign in</h1>
  <p>Sign in to manage data refreshes.</p>
  <form id="login">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
</main>
<script>
document.querySelector("#login").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.querySelector("#message");
  const button = event.currentTarget.querySelector("button");
  button.disabled = true;
  message.textContent = "";
  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: document.querySelector("#username").value,
        password: document.querySelector("#password").value
      })
    });
    if (!response.ok) {
      const result = await response.json();
      throw new Error(result.detail || "Sign in failed.");
    }
    location.replace("/admin");
  } catch (error) {
    message.textContent = error.message || "Sign in failed.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
